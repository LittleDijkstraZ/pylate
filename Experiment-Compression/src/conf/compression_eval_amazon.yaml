# Amazon dataset — compression evaluation config
# Reproduces the settings from results/compression_eval_amazon/20260220_235637/
#
# Usage:
#   python src/compression_eval_iterative/cli.py --config-name compression_eval_amazon
#
# Override the dataset path at runtime if needed:
#   AMAZON_DATASET=/path/to/beir_format python src/compression_eval_iterative/cli.py \
#       --config-name compression_eval_amazon dataset.name=${oc.env:AMAZON_DATASET}

defaults:
  - compression_eval  # inherit base defaults
  - _self_           # this file overrides last

model:
  name_or_path: "lightonai/GTE-ModernColBERT-v1"
  doc_len: 300
  query_len: null
  dtype: "bf16"         # original run used bf16
  compile: false

dataset:
  # Path relative to Experiment-Compression/ CWD, two levels up to AI2AI/, then into amazon_dataset.
  # Override via AMAZON_DATASET env var or dataset.name= on the CLI.
  name: "../../amazon_dataset/beir_format_full"
  lowercase: false

cache:
  enable: true
  dir: "cache/embeddings"
  schema_version: 1
  embedding_dtype: "fp32"   # original run used fp32

encode:
  batch_size: 512
  shard_size: 50000
  move_embeddings_to_cpu: true

compression:
  # 16 configs matching the 20260220_235637 run:
  #   1 baseline + 5 attention_pooling + 5 spherical_pooling + 5 random_pooling
  configs_file: "src/conf/amazon_compression_configs.jsonl"
  indices: null     # run all configs
  skip: 0
  resume: false
  resume_dir: null

retrieve:
  k: 100
  verbose: false

index:
  use_fast: true
  device: null              # auto (GPU if available)
  nbits: 4
  kmeans_niters: 4
  max_points_per_centroid: 256
  n_ivf_probe: 8
  n_full_scores: 8192
  n_samples_kmeans: null    # no cap on KMeans training samples
  batch_size: 16384
  use_triton: null
  fallback_on_oom: true

metrics:
  - "map"
  - "ndcg@10"
  - "ndcg@100"
  - "recall@10"
  - "recall@100"
  - "mrr@10"
  - "precision@10"

output:
  results_dir: "results/amazon"
  save_runfile: true
  save_jsonl: true

bm25:
  enabled: true
  variants:          # list of BM25 variants to evaluate; add "plus" or "l" for more
    - okapi

splade:
  enabled: false   # set true to add SPLADE as an additional baseline
  batch_size: 64
  max_length: 256
  retrieve_query_batch_size: 512
  device: null     # null = auto (CUDA if available)
  models:
    - model_name_or_path: "naver/splade-v3"           # gated — skipped if no access
    - model_name_or_path: "naver/splade-cocondenser-ensembledistil"  # public fallback


dense:
  enabled: false   # set true to add a dense bi-encoder baseline
  batch_size: 128
  max_length: 512
  normalize_embeddings: true
  retrieve_query_batch_size: 256
  device: null     # null = auto (CUDA if available)
  models:
    # - model_name_or_path: "Alibaba-NLP/gte-base-en-v1.5"

    - model_name_or_path: "sentence-transformers/all-mpnet-base-v2"

    # nvidia/NV-Embed-v2 — instruction-aware embedding model.
    # Requires: huggingface-cli login + accepting terms at huggingface.co/nvidia/NV-Embed-v2
    # Uses model.encode(instruction=...) path automatically (detected at runtime via hasattr).
    # normalize_embeddings is applied after model.encode() returns, matching the reference script.
    - model_name_or_path: "nvidia/NV-Embed-v2"
      max_length: 4096            # 32768 causes 226 GiB KV-cache OOM; 4096 fits within 93 GiB GPU
      batch_size: 1               # Mistral-7B backbone → smallest batch to minimise peak memory
      retrieve_query_batch_size: 64
      normalize_embeddings: true  # F.normalize(p=2) applied after encode(), matches reference code
      query_prefix: "Instruct: Given a question, retrieve passages that answer the question\nQuery: "
      passage_prefix: ""          # no instruction for passages (matches reference code)

    # intfloat/e5-mistral-7b-instruct — decoder-only (Mistral 7B) embedding model.
    # Uses last_token pooling (causal-LM architecture, no [CLS] token).
    # Query gets a task instruction; passages are encoded without prefix.
    - model_name_or_path: "intfloat/e5-mistral-7b-instruct"
      max_length: 4096            # e5-mistral supports up to 4096 tokens
      batch_size: 4               # large 7B model → keep batch small
      retrieve_query_batch_size: 64
      normalize_embeddings: true
      pooling_strategy: "last_token"  # required for decoder/causal-LM architectures
      query_prefix: "Instruct: Given a question, retrieve passages that answer the question\nQuery: "
      passage_prefix: ""          # no instruction for passages
